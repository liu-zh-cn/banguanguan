<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#7E5BFF"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2A3A8C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220" fill="url(#bg)"/>

  <!-- 毕业帽 -->
  <g filter="url(#sh)">
    <!-- 帽顶菱形 -->
    <polygon points="512,300 792,412 512,524 232,412" fill="url(#cap)"/>
    <!-- 帽身 -->
    <path d="M352 470 L352 600 Q512 672 672 600 L672 470 L512 528 Z" fill="#FFFFFF"/>
    <!-- 流苏 -->
    <path d="M792 412 L792 540" stroke="#FFD36B" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="792" cy="556" r="20" fill="#FFD36B"/>
  </g>

  <!-- 右下角对勾徽标：体现“管理/完成” -->
  <circle cx="716" cy="712" r="96" fill="#24C8A0" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M672 712 L704 748 L766 676" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
